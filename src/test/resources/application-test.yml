app:
  dominio-corporativo: utec.edu.pe

# La datasource (PostgreSQL) la inyecta Testcontainers via @ServiceConnection
# (ver PostgresTestContainerConfig). No se define H2 aqui para evitar conflicto
# de dialecto con el contenedor Postgres real usado en los tests E2E/integracion.
spring:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: false

# Propiedades requeridas por beans que en produccion vienen del entorno/credenciales.
# En test, el bean Storage real (GcsConfig) esta deshabilitado (@Profile("!test"))
# y se reemplaza por GcsTestConfig (emulador fake-gcs-server).
firebase:
  service-account-path: classpath:test-firebase-credentials.json
gcs:
  bucket-name: llosa-test-bucket
