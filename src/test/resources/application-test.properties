app.dominio-corporativo=utec.edu.pe
spring.jpa.hibernate.ddl-auto=create-drop
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;IGNORE_UNKNOWN_SETTINGS=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
spring.sql.init.data-locations=classpath:data-test.sql

firebase.service-account-path=src/test/resources/dummy-firebase.json
gcs.bucket-name=dummy-bucket
FIREBASE_CREDENTIALS_PATH=src/test/resources/dummy-firebase.json
GCS_BUCKET_NAME=dummy-bucket
DOMINIO_CORPORATIVO=utec.edu.pe

google.oauth.client-id=dummy-client-id
google.oauth.client-secret=dummy-client-secret
google.oauth.redirect-uri=http://localhost:8080