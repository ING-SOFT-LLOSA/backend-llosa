spring:
  datasource:
    url: jdbc:postgresql://localhost:${LOCAL_PORT}/${DB_NAME}
    username: ${USERNAME}
    password: ${PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

firebase:
  service-account-path: classpath:firebase-service-account.json

app:
  dominio-corporativo: ${DOMINIO}