# ATENCIÓN AGENTES: Este archivo es crítico para infraestructura. NO modificarlo sin aprobación explícita.
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: llosa_backend_test
    environment:
      - DOMINIO_CORPORATIVO=${DOMINIO_CORPORATIVO}
      - SHOW_SQL=${SHOW_SQL}
      - SPRING_FLYWAY_SCHEMAS=public,proyectos,seguridad,activos,etapas
      - FIREBASE_CREDENTIALS_PATH=/app/secrets/firebase-service-account.json
      - DB_URL=${DB_URL}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - GCS_BUCKET_NAME=${GCS_BUCKET_NAME}
      - SPRING_PROFILES_ACTIVE=demo
    networks:
      - proxy_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  proxy_net:
    external: true
