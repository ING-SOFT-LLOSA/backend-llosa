name: llosa_backend
services:
  postgres:
    image: postgres:16
    container_name: llosa_db
    environment:
      # Lado izquierdo (exigido por Postgres) : Lado derecho (lo que SÍ está en tu .env)
      POSTGRES_DB: llosa_db
      POSTGRES_USER: ${DB_USERNAME_LLOSA}
      POSTGRES_PASSWORD: ${DB_PASSWORD_LLOSA}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - llosa_network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        FIREBASE_API_KEY: ${FIREBASE_API_KEY}
    container_name: llosa_backend
    environment:
      # Inyectamos el host 'postgres' pero mantenemos el nombre de la base de datos
      DB_URL_LLOSA: jdbc:postgresql://postgres:5432/llosa_db
      DB_USERNAME_LLOSA: ${DB_USERNAME_LLOSA}
      DB_PASSWORD_LLOSA: ${DB_PASSWORD_LLOSA}
      DOMINIO_CORPORATIVO_LLOSA: ${DOMINIO_CORPORATIVO_LLOSA}
      SHOW_SQL_LLOSA: ${SHOW_SQL_LLOSA}
      FIREBASE_API_KEY_LLOSA: ${FIREBASE_API_KEY_LLOSA}
      SPRING_FLYWAY_SCHEMAS_LLOSA: ${SPRING_FLYWAY_SCHEMAS_LLOSA}
      FIREBASE_CREDENTIALS_PATH_LLOSA: /secrets/firebase-service-account.json
    volumes:
      - ./secrets/firebase-service-account.json:/secrets/firebase-service-account.json:ro
    depends_on:
      - postgres
    networks:
      - proxy_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  proxy_net:
    external: true