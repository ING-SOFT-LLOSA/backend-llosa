services:
  postgres:
    image: postgres:16
    container_name: llosa_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - llosa_network

  backend:
    build: .
    container_name: llosa_backend
    ports:
      - "8080:8080"
    environment:
      # Apunta al contenedor 'postgres' dentro de la red de Docker
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DOMINIO_CORPORATIVO: ${DOMINIO_CORPORATIVO}
      # Ruta interna dentro del contenedor Docker
      FIREBASE_CREDENTIALS_PATH: /secrets/firebase-service-account.json
    volumes:
      # Monta tu archivo local seguro dentro del contenedor en modo lectura (ro)
      - ./secrets/firebase-service-account.json:/secrets/firebase-service-account.json:ro
    depends_on:
      - postgres
    networks:
      - llosa_network

volumes:
  postgres_data:

networks:
  llosa_network:
    driver: bridge