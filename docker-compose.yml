services:
  db:
    image: postgres:16-alpine
    container_name: llosa_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - llosa_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: llosa_backend_dev
    ports:
      - "${BACKEND_PORT}:8080"
    environment:
      - DB_URL=jdbc:postgresql://db:5432/${POSTGRES_DB}
      - DB_USERNAME=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DOMINIO_CORPORATIVO=${DOMINIO_CORPORATIVO}
      - SHOW_SQL=${SHOW_SQL}
      - GCS_BUCKET_NAME=${GCS_BUCKET_NAME}
      - FIREBASE_CREDENTIALS_PATH=/app/secrets/firebase-service-account.json
      - SPRING_PROFILES_ACTIVE=demo
    volumes:
      - ./secrets/firebase-service-account.json:/app/secrets/firebase-service-account.json
    networks:
      - llosa_net
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  pgdata:

networks:
  llosa_net:
    driver: bridge
