name: llosa_backend
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        FIREBASE_API_KEY: ${FIREBASE_API_KEY_LLOSA}
    container_name: llosa_backend
    environment:
      - FIREBASE_API_KEY_LLOSA=${FIREBASE_API_KEY_LLOSA}
      - DOMINIO_CORPORATIVO_LLOSA=${DOMINIO_CORPORATIVO_LLOSA}
      - SHOW_SQL_LLOSA=${SHOW_SQL_LLOSA}
      - SPRING_FLYWAY_SCHEMAS_LLOSA=${SPRING_FLYWAY_SCHEMAS_LLOSA}
      - FIREBASE_CREDENTIALS_PATH_LLOSA=${FIREBASE_CREDENTIALS_PATH_LLOSA}
    networks:
      - proxy_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  proxy_net:
    external: true