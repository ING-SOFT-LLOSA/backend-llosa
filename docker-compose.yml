name: llosa_backend
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        FIREBASE_API_KEY: ${FIREBASE_API_KEY}
    container_name: llosa_backend
    env_file:
      - ./secrets/backend.env
    environment:
      - FIREBASE_CREDENTIALS_PATH=/app/secrets/firebase-service-account.json
    networks:
      - proxy_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  proxy_net:
    external: true
