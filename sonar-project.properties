sonar.projectKey=llosa-backend
sonar.projectName=Llosa Edificaciones Backend
sonar.projectVersion=1.0.0

# === Java Configuration ===
sonar.language=java
sonar.sourceEncoding=UTF-8
sonar.java.source=21
sonar.java.target=21

# === Source and Test Paths ===
sonar.sources=src/main/java
sonar.tests=src/test/java

sonar.java.binaries=target/classes
sonar.java.test.binaries=target/test-classes

# === Coverage Reports ===
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
sonar.junit.reportPaths=target/surefire-reports

# === Exclusions from Analysis ===
sonar.exclusions=\
    **/target/**,\
    **/*.sql,\
    **/firebase-service-account.json

# === Exclusions from Coverage ===
# GoogleCalendarServiceImpl y GoogleOAuthServiceImpl son clientes HTTP contra la API
# externa de Google (OAuth/Calendar): su parte de red no es testeable unitariamente
# sin credenciales reales, por lo que se excluyen de la métrica de cobertura igual
# que la configuración y los DTOs/entidades.
sonar.coverage.exclusions=\
    **/dto/**,\
    **/entity/**,\
    **/config/**,\
    **/BackendLlosaApplication.java,\
    **/agenda/service/impl/GoogleCalendarServiceImpl.java,\
    **/agenda/service/impl/GoogleOAuthServiceImpl.java

# === Duplicate Code Detection Exclusions ===
sonar.cpd.exclusions=\
    **/dto/**,\
    **/entity/**